# forgewright configuration
# -------------------------
# Copy to /etc/forgewright/config.yaml and edit.

# Platform URL.  For GitLab: the instance base URL.
# For GitHub: https://api.github.com (or your GHE URL).
# The old key "gitlab_url" is still accepted as a fallback.
platform_url: "https://gitlab.example.com"

# API token for the bot user.
# GitLab: Personal Access Token (scopes: api, read_repository, write_repository).
# GitHub: Fine-grained PAT (contents:write, pull_requests:write, issues:write).
# You can either put it here (chmod 600!) or set via the PLATFORM_TOKEN
# environment variable (recommended for systemd).  GITLAB_TOKEN is also
# accepted as a fallback.
platform_token: ""

# Username of the bot user. Must match the token owner.
# This value ALSO defines the mention that triggers the bot: the bot reacts
# to "@<bot_username>" in issue/MR descriptions and comments.
# Examples:
#   bot_username: "forgewright"  -> react to "@forgewright ..."
#   bot_username: "jarvis"       -> react to "@jarvis ..."
# If the token owner's actual username differs from this value, the bot
# logs a warning at startup and uses the token owner's username instead.
bot_username: "forgewright"

# Where the bot keeps its working files.
workdir:    "/var/lib/forgewright/work"
state_file: "/var/lib/forgewright/state.json"
lock_dir:   "/var/lib/forgewright/locks"
log_file:   "/var/log/forgewright/bot.log"

# Path to the `claude` CLI (run `which claude` on the VM).
# Only used when agent_type is "claude".
claude_binary: "/usr/local/bin/claude"

# Optional model override (leave null to use Claude's default).
# Valid examples: "claude-opus-4-6", "claude-sonnet-4-6", "claude-haiku-4-5-20251001"
claude_model: null

# Branch naming. Every branch the bot creates starts with this prefix.
branch_prefix: "forgewright/"

# Leave null to use each project's default branch as the base.
default_base_branch: null

# Git identity used on commits the bot creates directly (rare — usually the agent commits).
git_user_name:  "Forgewright"
git_user_email: "forgewright@example.com"

# Project scoping. Leave both empty to watch EVERY project the bot is a member of.
# Use `path_with_namespace`, e.g. "marcel/myrepo" or "team/subgroup/proj".
projects_include: []
projects_exclude: []

# Extra repositories the agent may READ for context (shared libraries, API
# specs, docs). Keyed by watched project path; "*" applies to every project.
# forgewright clones them with its own token and checks them out read-only
# under .forgewright/context/<name>/ in the worktree — the agent never gets
# the token, and nothing there is committed or pushed. A repo the token can't
# read is shown to the agent as "not available"; the run goes on.
# Visibility: text from these repos can end up in comments on the watched
# project, so only list repos whose content everyone there may see.
#   context_repos:
#     group/app:
#       - group/shared-lib            # default branch
#       - path: group/api-spec
#         ref: v2                     # branch, tag or commit SHA
#     "*":
#       - group/engineering-docs
context_repos: {}

# Let the agent ASK for a repository it needs that isn't listed above. It
# writes "## Request repo: group/name" in its summary; the bot asks in the
# issue/MR, and a human answers "@forgewright allow repo group/name" (or
# "deny repo" / "revoke repo"). Only someone who can read that repo's code
# may allow it (GitLab: reporter+, GitHub: read+) — the bot token often sees
# more than the people in the MR. Decisions are stored per watched project.
context_requests: true

# Authorization: minimum role a user must have on the repo to interact with the
# bot. Only mentions from users at or above this role trigger the bot, and
# comments from users below it are stripped before any text reaches the AI agent
# (this hinders prompt-injection by drive-by accounts). Resolved per user via
# the platform API and cached per run; if a role can't be determined the user is
# treated as unauthorized (fail closed).
#   Accepted: read|guest, triage|reporter, write|developer|contributor,
#             maintain|maintainer, admin|owner.  Defaults to "write" when the key
#             is missing. Set to "none" to disable the check and let any
#             user trigger the bot.
# GitHub note: a fine-grained PAT needs the "Metadata" (and "Members"/admin
#   read for org repos) permission to read collaborator roles.
authorization_min_role: "write"

# Platform type. Options: "gitlab", "github" (future: "forgejo")
platform_type: "gitlab"

# AI agent to use. Options: "claude" (Claude Code), "hermes" (Hermes Agent by
# Nous Research — any OpenAI-compatible model, bring your own key),
# "opencode" (OpenCode — deprecated, use "hermes" instead).
agent_type: "claude"

# Hard cap per agent run so a broken agent cannot burn through credits.
claude_timeout_sec: 3600

# When a pipeline on one of the bot's own MRs fails, the bot tries to fix it.
# After this many automatic attempts in a row it stops and waits for a human
# comment on the MR (which also resets the counter).
max_ci_fix_attempts: 3

# Hermes Agent settings (only used when agent_type is "hermes").
# With hermes_base_url set, forgewright runs Hermes against that
# OpenAI-compatible endpoint (LiteLLM, vLLM, OpenRouter, a local server ...)
# through a Hermes profile it manages itself (hermes_profile, default
# "forgewright"; by default no persistent memory or self-learning between
# runs — see hermes_learning). Without it, your existing Hermes setup is used
# unchanged.
hermes_binary: "hermes"
hermes_base_url: null            # e.g. "https://llm.example.com/v1"
hermes_model: null               # model id at that endpoint; required with base_url
# API key for the endpoint. Prefer the HERMES_API_KEY env var over putting it
# here. Leave empty for local servers that need no key. Hermes profiles read
# keys only from their own .env, so it is written to
# ~/.hermes/profiles/<profile>/.env (mode 0600) — never on the command line.
hermes_api_key: null
# none | minimal | low | medium | high | xhigh | max  (null = Hermes default)
hermes_reasoning_effort: null
# Total context window in tokens (input + output). null = auto-detect from the
# endpoint; set it when auto-detection is wrong (common with local servers).
# Hermes needs at least 64000 for agent use.
hermes_context_length: null
# Max tool-calling iterations per run (null = Hermes default).
hermes_max_turns: null
# Hermes profile. Managed mode: the profile forgewright owns and rewrites
# (default "forgewright" — don't point it at a profile you use yourself).
# Without hermes_base_url: an existing profile of yours to run as-is.
hermes_profile: null
# Let Hermes learn about each codebase across runs: persistent memory, skills
# it writes for itself and a post-run self-review. Each watched project gets
# its own profile (<hermes_profile>-<project>-<hash>), so nothing learned in
# one repo leaks into another. Off by default because anything that reaches
# the prompt (issue text, diffs, CI logs) can then influence later runs —
# keep authorization_min_role strict when enabling it. Docker: the hermes
# compose services keep these profiles in the hermes-profiles volume.
# Reset a project's memory by deleting ~/.hermes/profiles/<that profile>.
hermes_learning: false

# OpenCode settings (only used when agent_type is "opencode").
# DEPRECATED: OpenCode support stays for now but gets no new features; prefer
# agent_type "hermes".
opencode_binary: "opencode"
opencode_model: null

# Timeout for individual platform API requests (seconds).
request_timeout_sec: 30

# Number of retries for failed platform API requests (5xx, timeouts).
http_retries: 3

# --- Webhook server (optional, for near-real-time event processing) ----------
# When enabled, run `forgewright --serve` to start a long-running HTTP server
# that receives platform webhook events. The polling timer acts as a fallback.

# Set to true to allow `--serve` mode.
webhook_enabled: false

# Bind address and port for the webhook server. Can be overridden by the
# WEBHOOK_HOST env var (the Docker image sets it to 0.0.0.0 so the published
# port is reachable inside the container — put a reverse proxy in front).
webhook_host: "127.0.0.1"
webhook_port: 5000

# Secret token for validating webhook requests. Must match the secret
# configured on the platform (e.g. GitLab Settings → Webhooks).
# REQUIRED when webhook_enabled is true: `--serve` refuses to start without it,
# and requests with no/invalid signature are rejected (fail closed).
# Can also be set via the WEBHOOK_SECRET env var.
webhook_secret: ""

# Debounce delay (seconds) for webhook events. When multiple events arrive
# for the same project within this window, only the last one triggers
# processing. Set to 0 to disable debouncing (immediate processing).
webhook_debounce_sec: 60
